
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Insights Dashboard (Light Mode)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/company-updates.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/dashboard-background.css">
  <link rel="stylesheet" href="css/history-cards.css">
  <link rel="stylesheet" href="modules/training-competency/css/training-calendar.css">
  <script src="js/components.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/dashboard-background.js" defer></script>
  <script src="modules/training-competency/js/training-competency-data.js" defer></script>
  <script src="modules/training-competency/js/training-calendar.js" defer></script>
</head>

<body data-training-calendar-page="home">

  <!-- Desktop Switcher Bar (Instant Theme & Page Navigation) -->
  <preview-top-bar active-page="v1"></preview-top-bar>

  <div class="phone-container dashboard-page dashboard-home">
    <!-- Royal Purple Constellation Hero Background -->
    <phone-hero-bg></phone-hero-bg>

    <!-- Status Bar (9:41, Signal, Wifi, Battery) -->
    <phone-status-bar time="9:41"></phone-status-bar>

    <!-- Header (Burger Menu, Logo, In-Phone Theme Switcher, Profile Avatar) -->
    <app-header></app-header>

    <!-- Scrollable Main Content -->
    <div class="main-content">
      <!-- Greeting Header -->
      <div class="greeting-header-box">
        <h2 class="greeting-title">Good morning, Sarah</h2>
        <p class="greeting-sub">Here's what matters today.</p>
      </div>

      <!-- ========================================================
           1. INSIGHTS CARD (MY & TEAM INSIGHTS)
           ======================================================== -->
      <section class="insights-card" aria-labelledby="insightCardTitle">
        <div class="insights-header">
          <div class="insights-title-group">
            <h2 class="insights-title" id="insightCardTitle">My Insights</h2>
            <p class="insights-metric-count" id="insightMetricCount">14 metrics</p>
          </div>
          <div class="insights-pills" role="group" aria-label="Insights scope">
            <button type="button" class="insight-pill active" id="pillMy" aria-pressed="true" aria-controls="paneMy" onclick="switchInsightTab('my')">My</button>
            <button type="button" class="insight-pill" id="pillTeam" aria-pressed="false" aria-controls="paneTeam" onclick="switchInsightTab('team')">Team</button>
          </div>
        </div>

        <div class="insight-tab-pane active" id="paneMy" data-insight-scope="my" role="region" aria-label="My insights">
          <div class="insight-metrics-grid">
            <section class="insight-metric-group" data-group="positive" aria-label="Positive metrics">
              <button type="button" class="insight-group-header" onclick="openInsightBreakdown('my', 'positive')" aria-label="View all 4 positive metrics">
                <span class="insight-group-heading">
                  <span class="insight-group-title">Positive</span>
                  <span class="insight-group-count">4</span>
                </span>
                <span class="insight-group-hint">Higher is better</span>
              </button>
              <div class="insight-trend-list">
                <button type="button" class="insight-trend-row" data-trend="improved" onclick="openInsightBreakdown('my', 'positive', 'improved')" aria-label="Positive metrics: Improved, 1">
                  <span class="insight-trend-label">Improved</span>
                  <span class="insight-trend-count">1</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="worsened" onclick="openInsightBreakdown('my', 'positive', 'worsened')" aria-label="Positive metrics: Worsened, 0">
                  <span class="insight-trend-label">Worsened</span>
                  <span class="insight-trend-count">0</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="unchanged" onclick="openInsightBreakdown('my', 'positive', 'unchanged')" aria-label="Positive metrics: No change, 3">
                  <span class="insight-trend-label">No change</span>
                  <span class="insight-trend-count">3</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
              </div>
            </section>
            <section class="insight-metric-group" data-group="negative" aria-label="Negative metrics">
              <button type="button" class="insight-group-header" onclick="openInsightBreakdown('my', 'negative')" aria-label="View all 10 negative metrics">
                <span class="insight-group-heading">
                  <span class="insight-group-title">Negative</span>
                  <span class="insight-group-count">10</span>
                </span>
                <span class="insight-group-hint">Lower is better</span>
              </button>
              <div class="insight-trend-list">
                <button type="button" class="insight-trend-row" data-trend="improved" onclick="openInsightBreakdown('my', 'negative', 'improved')" aria-label="Negative metrics: Improved, 0">
                  <span class="insight-trend-label">Improved</span>
                  <span class="insight-trend-count">0</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="worsened" onclick="openInsightBreakdown('my', 'negative', 'worsened')" aria-label="Negative metrics: Worsened, 1">
                  <span class="insight-trend-label">Worsened</span>
                  <span class="insight-trend-count">1</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="unchanged" onclick="openInsightBreakdown('my', 'negative', 'unchanged')" aria-label="Negative metrics: No change, 9">
                  <span class="insight-trend-label">No change</span>
                  <span class="insight-trend-count">9</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
              </div>
            </section>
          </div>
        </div>
        <div class="insight-tab-pane" id="paneTeam" data-insight-scope="team" role="region" aria-label="Team insights" hidden>
          <div class="insight-metrics-grid">
            <section class="insight-metric-group" data-group="positive" aria-label="Positive metrics">
              <button type="button" class="insight-group-header" onclick="openInsightBreakdown('team', 'positive')" aria-label="View all 3 positive metrics">
                <span class="insight-group-heading">
                  <span class="insight-group-title">Positive</span>
                  <span class="insight-group-count">3</span>
                </span>
                <span class="insight-group-hint">Higher is better</span>
              </button>
              <div class="insight-trend-list">
                <button type="button" class="insight-trend-row" data-trend="improved" onclick="openInsightBreakdown('team', 'positive', 'improved')" aria-label="Positive metrics: Improved, 1">
                  <span class="insight-trend-label">Improved</span>
                  <span class="insight-trend-count">1</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="worsened" onclick="openInsightBreakdown('team', 'positive', 'worsened')" aria-label="Positive metrics: Worsened, 1">
                  <span class="insight-trend-label">Worsened</span>
                  <span class="insight-trend-count">1</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="unchanged" onclick="openInsightBreakdown('team', 'positive', 'unchanged')" aria-label="Positive metrics: No change, 1">
                  <span class="insight-trend-label">No change</span>
                  <span class="insight-trend-count">1</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
              </div>
            </section>
            <section class="insight-metric-group" data-group="negative" aria-label="Negative metrics">
              <button type="button" class="insight-group-header" onclick="openInsightBreakdown('team', 'negative')" aria-label="View all 9 negative metrics">
                <span class="insight-group-heading">
                  <span class="insight-group-title">Negative</span>
                  <span class="insight-group-count">9</span>
                </span>
                <span class="insight-group-hint">Lower is better</span>
              </button>
              <div class="insight-trend-list">
                <button type="button" class="insight-trend-row" data-trend="improved" onclick="openInsightBreakdown('team', 'negative', 'improved')" aria-label="Negative metrics: Improved, 4">
                  <span class="insight-trend-label">Improved</span>
                  <span class="insight-trend-count">4</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="worsened" onclick="openInsightBreakdown('team', 'negative', 'worsened')" aria-label="Negative metrics: Worsened, 1">
                  <span class="insight-trend-label">Worsened</span>
                  <span class="insight-trend-count">1</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button type="button" class="insight-trend-row" data-trend="unchanged" onclick="openInsightBreakdown('team', 'negative', 'unchanged')" aria-label="Negative metrics: No change, 4">
                  <span class="insight-trend-label">No change</span>
                  <span class="insight-trend-count">4</span>
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
              </div>
            </section>
          </div>
        </div>
      </section>


      <!-- ========================================================
           3. FOR YOU SECTION
           ======================================================== -->
      <div class="section-header">
        <span class="section-title">For You</span>
      </div>

      <div class="for-you-list" data-home-notifications aria-label="Notifications and reminders"></div>

      <!-- ========================================================
           4. COMPANY UPDATES
           ======================================================== -->
      <div class="section-header">
        <span class="section-title">Company Updates</span>
        <a class="section-action" data-company-updates-link href="company-updates.html?theme=light">View All</a>
      </div>

      <div class="updates-list">
        <div class="update-card" data-category="news" onclick="openUpdatesModal()">
          <span class="unread-indicator" aria-hidden="true"></span>
          <div class="update-thumb" aria-hidden="true"><i class="fa-solid fa-bullhorn"></i></div>
          <div class="update-content">
            <span class="update-tag">News · Unread</span>
            <h4 class="update-title">Town Hall this Friday</h4>
            <span class="update-meta">Today</span>
          </div>
        </div>

        <div class="update-card" data-category="policy" onclick="openUpdatesModal()">
          <div class="update-thumb" aria-hidden="true"><i class="fa-solid fa-clipboard-list"></i></div>
          <div class="update-content">
            <span class="update-tag">Policy &amp; SOP</span>
            <h4 class="update-title">Hybrid & Remote Work Policy 2026</h4>
            <span class="update-meta">Effective <time datetime="2026-01-15">15/01/2026</time></span>
          </div>
          <span style="align-self: center; color: var(--text-muted); font-size: 16px;">›</span>
        </div>

        <div class="update-card" data-category="news" onclick="openUpdatesModal()">
          <div class="update-thumb" aria-hidden="true"><i class="fa-solid fa-trophy"></i></div>
          <div class="update-content">
            <span class="update-tag">News</span>
            <h4 class="update-title">PeopleQuest wins industry award</h4>
            <span class="update-meta">Yesterday</span>
          </div>
          <span style="align-self: center; color: var(--text-muted); font-size: 16px;">›</span>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar (5 tabs + Home Bar) -->
    <phone-bottom-nav active="home"></phone-bottom-nav>

    <!-- Slide-in Left Profile Drawer with Appearance Options -->
    <left-profile-drawer></left-profile-drawer>

    <!-- For You Notification Bottom Sheet Drawer -->
    <notification-sheet></notification-sheet>
    <training-schedule-sheet></training-schedule-sheet>

    <!-- All 14 Indicators Bottom Sheet Drawer -->
    <indicators-sheet></indicators-sheet>

    <!-- Policy & SOP Detail Bottom Sheet Drawer -->
    <policy-detail-sheet></policy-detail-sheet>
  </div>

</body>

</html>
