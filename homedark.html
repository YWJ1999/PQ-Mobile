
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Insights Dashboard (Dark Mode)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/company-updates.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/dashboard-background.css">
  <link rel="stylesheet" href="css/home-overview.css">
  <link rel="stylesheet" href="css/history-cards.css">
  <link rel="stylesheet" href="modules/training-competency/css/training-calendar.css">
  <script src="js/components.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/home-overview.js" defer></script>
  <script src="js/company-news-data.js" defer></script>
  <script src="modules/admin/js/policy-data.js" defer></script>
  <script src="js/company-updates.js" defer></script>
  <script src="js/dashboard-background.js" defer></script>
  <script src="modules/training-competency/js/training-competency-data.js" defer></script>
  <script src="modules/training-competency/js/training-calendar.js" defer></script>
</head>

<body data-training-calendar-page="home">

  <!-- Desktop Switcher Bar (Instant Theme & Page Navigation) -->
  <preview-top-bar active-page="v1"></preview-top-bar>

  <div class="phone-container dashboard-page dashboard-home" data-dashboard-intro=".greeting-header-box">
    <!-- Royal Purple Constellation Hero Background -->
    <phone-hero-bg></phone-hero-bg>

    <!-- Status Bar (9:41, Signal, Wifi, Battery) -->
    <phone-status-bar time="9:41"></phone-status-bar>

    <!-- Header (Burger Menu, Logo, In-Phone Theme Switcher, Profile Avatar) -->
    <app-header></app-header>

    <!-- Scrollable Main Content -->
    <div class="main-content">
      <!-- Greeting Header -->
      <div class="greeting-header-box">
        <h2 class="greeting-title">Good morning, Sarah</h2>
        <p class="greeting-sub">Here's what matters today.</p>
      </div>

      <div class="home-overview" data-home-notifications></div>

      <div class="section-header">
        <h2 class="section-title">Company Updates</h2>
        <a class="section-action" data-company-updates-link href="company-updates.html?theme=dark">View All</a>
      </div>

      <div class="updates-list">
        <a class="update-card" data-category="news" href="modules/admin/options/news-detail.html?theme=dark&amp;id=town-hall&amp;via=home">
          <div class="update-thumb" aria-hidden="true"><i class="fa-solid fa-bullhorn"></i></div>
          <div class="update-content">
            <span class="update-tag">News<span data-home-news-unread="town-hall" hidden> · Unread</span></span>
            <h4 class="update-title">Town Hall this Friday</h4>
            <span class="update-meta">Today</span>
          </div>
          <span class="update-chevron" aria-hidden="true"></span>
        </a>

        <a class="update-card" data-category="policy" href="company-updates.html?theme=dark&amp;via=home">
          <div class="update-thumb" aria-hidden="true"><i class="fa-solid fa-clipboard-list"></i></div>
          <div class="update-content">
            <span class="update-tag">Policy &amp; SOP</span>
            <h4 class="update-title">Company policy</h4>
            <span class="policy-summary"></span>
          </div>
          <span class="update-chevron" aria-hidden="true"></span>
        </a>

        <a class="update-card" data-category="news" href="modules/admin/options/news-detail.html?theme=dark&amp;id=industry-award&amp;via=home">
          <div class="update-thumb" aria-hidden="true"><i class="fa-solid fa-trophy"></i></div>
          <div class="update-content">
            <span class="update-tag">News<span data-home-news-unread="industry-award" hidden> · Unread</span></span>
            <h4 class="update-title">PeopleQuest wins industry award</h4>
            <span class="update-meta">Yesterday</span>
          </div>
          <span class="update-chevron" aria-hidden="true"></span>
        </a>
      </div>
    </div>

    <!-- Bottom Navigation Bar (5 tabs + Home Bar) -->
    <phone-bottom-nav active="home"></phone-bottom-nav>

    <!-- Slide-in Left Profile Drawer with Appearance Options -->
    <left-profile-drawer></left-profile-drawer>

    <!-- For You Notification Bottom Sheet Drawer -->
    <notification-sheet></notification-sheet>
    <training-schedule-sheet></training-schedule-sheet>

    <!-- All 14 Indicators Bottom Sheet Drawer -->
    <indicators-sheet></indicators-sheet>

    <!-- Policy & SOP Detail Bottom Sheet Drawer -->
    <policy-detail-sheet></policy-detail-sheet>
  </div>

</body>

</html>
