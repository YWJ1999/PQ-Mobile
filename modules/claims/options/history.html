  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 20px 0;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      height: 900px;
      background: var(--bg-phone);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
      position: relative;
      z-index: 10;
      scrollbar-width: none;
    }
    .main-content::-webkit-scrollbar { display: none; }

    .phone-container > .claim-history-header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 12px 20px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.28);
      position: relative;
      z-index: 20;
    }

    .claim-history-header-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 36px;
      align-items: center;
      gap: 12px;
      min-height: 36px;
      margin-top: 4px;
    }

    .claim-history-header-row h1 {
      min-width: 0;
      margin: 0;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    .claim-history-header-end {
      display: grid;
      place-items: center;
      width: 36px;
      min-height: 36px;
    }


    /* Enterprise Filter Toast Bar (Matching Attendance History Screenshot 1) */
    .enterprise-toast-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .history-filter-period-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 10px;
    }

    .claim-history-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      overflow: hidden;
      margin-bottom: 14px;
    }

    .claim-history-tabs .me-jump-pill { justify-content: center; padding-inline: 4px; }
    .claim-history-tabs .me-jump-pill:not(.active) {
      background: transparent;
      box-shadow: none;
      color: var(--text-primary);
    }
    .claim-history-tabs .me-jump-pill i { font-size: 10px; }

    .claim-category-overlay {
      position: absolute;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, 0.4);
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, visibility 0s 0.3s;
    }
    .claim-category-overlay.active {
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
      transition-delay: 0s;
    }

    .claim-category-sheet {
      width: 100%;
      max-height: 85%;
      background: var(--bg-card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 10px 18px calc(20px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sheet);
    }
    .claim-category-overlay.active .claim-category-sheet {
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .claim-category-overlay, .claim-category-sheet { transition: none; }
    }

    .claim-category-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .claim-category-sheet-header h2 { font-size: 18px; font-weight: 800; }
    .claim-category-close {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
    }
    .claim-category-option {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 10px;
      border: 0;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .claim-category-option + .claim-category-option { border-top: 1px solid var(--border-subtle); }
    .claim-category-option.active { color: var(--purple-text); font-weight: 800; }

    .claim-history-tabs button:focus-visible, .claim-category-sheet button:focus-visible {
      outline: 2px solid var(--purple-primary);
      outline-offset: -2px;
    }

    .claim-history-form-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .claim-history-form-summary > strong { font-size: 14px; overflow-wrap: anywhere; }
    .claim-history-form-summary > :last-child { flex-shrink: 0; }
    .claim-history-form-notes dd { margin: 0 0 12px; font-size: 13px; overflow-wrap: anywhere; }
    .claim-history-form-notes dd:last-child { margin-bottom: 0; }
  </style>
</head>

    function normalizeHistoryPeriod(value, fallbackIsoDate = '') {
      const rawValue = String(value || '').trim();
      const separatedMatch = rawValue.match(/^(\d{4})\D+(\d{1,2})$/);
      const compactValue = rawValue.replace(/\D/g, '');
      let year = '';
      let month = '';

      if (separatedMatch) {
        year = separatedMatch[1];
        month = separatedMatch[2];
      } else if (/^\d{5,6}$/.test(compactValue)) {
        year = compactValue.slice(0, 4);
        month = compactValue.slice(4);
      } else {
        const isoMatch = String(fallbackIsoDate || '').match(/^(\d{4})-(\d{1,2})/);
        if (isoMatch) {
          year = isoMatch[1];
          month = isoMatch[2];
        }
      }

      const monthNumber = Number(month);
      if (!year || monthNumber < 1 || monthNumber > 12) return '202601';
      return `${year}${String(monthNumber).padStart(2, '0')}`;
    }

    const toHistoryRecord = record => {
      const date = new Date(`${record.isoDate}T00:00:00`);
      const dateParts = record.dateRange.split(' - ');
      return {
        ...record,
        title: record.expense,
        subtype: record.expense,
        date: date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase(),
        day: String(date.getDate()).padStart(2, '0'),
        month: date.toLocaleDateString('en-GB', { month: 'short' }).toUpperCase(),
        dayName: date.toLocaleDateString('en-GB', { weekday: 'short' }).toUpperCase(),
        amount: Number(record.amount || 0).toFixed(2),
        quantity: '1.00',
        claimPeriod: record.period,
        dateFrom: dateParts[0],
        dateTo: dateParts[1] || dateParts[0],
        benefitYear: String(record.period).slice(0, 4),
        currency: 'MYR'
      };
    };

      if (!HISTORY_DATA[tab]) HISTORY_DATA[tab] = [];
      const knownIds = new Set(HISTORY_DATA[tab].map(record => record.id));
      records.forEach(record => { if (!knownIds.has(record.id)) HISTORY_DATA[tab].push(toHistoryRecord(record)); });
    });

    function historyReceiptNumbers(item) {
      const entries = [item, item.claimDetails, item.detailItems, item.travelItems, item.expenseItems, item.itemizedDetails].flat();
      const values = entries.map(entry => entry?.receiptNo);
      for (const detail of item.entertainmentDetails || []) {
        values.push(detail.ref || detail.receiptNo);
      }
      const numbers = values.map(value => String(value ?? '').trim()).filter(Boolean);
      if (numbers.length) return [...new Set(numbers)].join(', ');

      // Older status records store labels such as "Receipt #9821" or "Inv #OW-5510".
      return String(item.receipt ?? '').trim().match(/\b(?:receipt|rec|invoice|inv)\s*#\s*(\S+)$/i)?.[1] || '';

          detailsBlock = '<div class="history-card-fields"></div>';
        } else if (activeTabKey === 'ot') {
          const timeDisplay = item.otTime || item.time || '18:00 - 00:00';
          const hoursDisplay = `${item.quantity || item.hours || '6.0'} Hours`;
          detailsBlock = `
            <div class="history-card-fields">
              <div style="grid-column: 1 / -1;">
                <span>Claim Period</span>
                <span>${periodDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Time</span>
                <span style="color: var(--text-primary); font-weight: 700;">${timeDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Hours</span>
                <span style="font-size: 14px; font-weight: 900; color: var(--text-primary);">${hoursDisplay}</span>
              </div>
              ${statusRow}
            </div>
          `;
        } else if (activeTabKey === 'travel') {
          detailsBlock = `
            <div class="history-card-fields">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Period</span>
                <span style="color: var(--text-primary); font-weight: 700; font-family: monospace, sans-serif;">${periodDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Claim Date</span>
                <span style="color: var(--text-primary); font-weight: 700;">${datesDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Claim Amount</span>
                <span style="font-size: 14px; font-weight: 900; color: var(--text-primary);">RM ${item.amount}</span>
              </div>
              ${statusRow}
            </div>
          `;
        } else if (activeTabKey === 'advance') {
          detailsBlock = `
            <div class="history-card-fields">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Date Claim</span>
                <span style="color: var(--text-primary); font-weight: 700;">${datesDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Claim Amount</span>
                <span style="font-size: 14px; font-weight: 900; color: var(--text-primary);">RM ${item.amount}</span>
              </div>
              ${statusRow}
            </div>
          `;
        } else if (activeTabKey === 'expense' || activeTabKey === 'benefit' || activeTabKey === 'medical') {
          detailsBlock = `
            <div class="history-card-fields">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Claim Period</span>
                <span style="color: var(--text-primary); font-weight: 700; font-family: monospace, sans-serif;">${periodDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Claim Dates</span>
                <span style="color: var(--text-primary); font-weight: 700;">${datesDisplay}</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 600;">Amount</span>
                <span style="font-size: 14px; font-weight: 900; color: var(--text-primary);">RM ${item.amount}</span>
              </div>
              ${statusRow}
            </div>
          `;
        }

        const statusIconMap = {
          approved: 'fa-square-check',
          submitted: 'fa-paper-plane',
          draft: 'fa-floppy-disk',
          cancelled: 'fa-ban',
          resubmit: 'fa-rotate-left',
          rejected: 'fa-circle-xmark'
        };
        const statusIcon = statusIconMap[displayStatus.key] || 'fa-circle-info';
        const actionHtml = renderClaimHistoryActions(item);

        const cardTitle = activeTabKey === 'ot'
          ? datesDisplay
          : activeTabKey === 'travel'
            ? (item.purpose || 'No Purpose')
          : activeTabKey === 'travelRequest'
            ? (item.destination || 'No Destination')
          : (activeTabKey === 'advance' || activeTabKey === 'expense')
            ? (item.purpose || 'No Purpose')
            : item.title;

        card.innerHTML = `
          <div class="history-card-header">
            <div class="history-card-heading">
              <div class="history-card-title-row">
                <h4 class="history-card-title"></h4>
              </div>
              <div class="history-card-ref">Ref ${item.id}</div>
            </div>
            <span class="status-pill ${displayStatus.key}">
              <i class="fa-solid ${statusIcon}"></i>
            </span>
          </div>
          ${recordSubmitDate.cardHTML(item.submitDate || item.submittedDate)}
          <div class="history-card-details">${detailsBlock}</div>
          ${actionHtml}
        `;
        card.querySelector('.history-card-title').textContent = item.savedClaim ? item.title : cardTitle;
        const fieldGroup = card.querySelector('.history-card-fields');
        const fields = [];
        if (claimType === 'Travel Request') {
          const travelDates = [item.travelDateFrom || item.dateFrom, item.travelDateTo || item.dateTo]
            .filter(date => date && date !== '—')
            .map(ClaimApplicationFields.display);
          fields.push(
            ['Travel Period', periodDisplay],
            ['Travel Dates', [...new Set(travelDates)].join(' - ') || '—'],
            ['Destination', item.destination || '—'],
            ['Travel Type', item.travelType || '—'],
            ['Purpose', item.purpose || '—']
          );
        } else if (isEntertainment) {
          const ringgit = value => {
            const text = String(value ?? '').trim().replace(/^RM\s*/i, '').replace(/,/g, '');
            const amount = Number(text);
            return text && Number.isFinite(amount) ? `RM ${amount.toFixed(2)}` : '—';
          };
          fields.push(
            ['Claim Period', periodDisplay],
            ['Claim Dates', datesDisplay],
            ['Claim Amount', ringgit(item.amount)],
            ['Avg Per Pax', ringgit(item.avgPerPax ?? item.averagePerPax)]
          );
        } else if (fieldGroup?.hasAttribute('data-saved-claim-fields')) {
          const dateLabel = item.historyTab === 'travel' ? 'Claim Date' : 'Date';
          fields.push(['Claim Period', periodDisplay], [dateLabel, datesDisplay]);
          if (item.optionName === 'OT Claim') fields.push(['OT Hours', item.hours]);
          else fields.push(['Claim Total', item.amount]);
        }
        const receiptNumbers = isEntertainment ? '' : historyReceiptNumbers(item);
        if (receiptNumbers || claimType === 'Benefit Claim' || claimType === 'Medical Claim') {
          fields.push(['Receipt No.', receiptNumbers || '—']);
        }
        if (claimType === 'Travel Claim') fields.push(['Charge to', item.chargeTo || '—']);
        for (const [label, value] of fields) {
          const row = document.createElement('div');
          if (claimType === 'OT Claim' && label === 'Claim Period') row.style.gridColumn = '1 / -1';
          const name = document.createElement('span');
          const content = document.createElement('span');
          name.textContent = label;
          content.textContent = value;
          row.append(name, content);
          fieldGroup.append(row);
        }
        card.querySelector('.status-pill').append(document.createTextNode(' ' + displayStatus.text));
        container.appendChild(card);
      });
    }

    function handleHistoryCancel(event, itemId) {
      event.stopPropagation();
      const saved = ClaimRequestStore.list().find(item => item.docRef === itemId);
      if (saved) {
        try {
          ClaimRequestStore.decide([saved.id], 'cancel');
        } catch {
          showToast('Could not cancel the claim. Please check its status.');
          return;
        }
        HistoryRecordPage.back();
        renderClaimHistoryList();
        showToast('Claim cancelled.');
        return;
      }
      if (typeof showToast === 'function') {
        showToast(`Cancel selected for ${itemId}`);
      }
    }

    function handleHistorySubmit(event, itemId) {
      event.stopPropagation();
      if (typeof showToast === 'function') {
        showToast(`Submit selected for ${itemId}`);
      }
    }

    function openMoreClaimCategories() {
      claimHistoryMoreList.replaceChildren(...moreClaimCategories.map(category => {
        const selected = category.id === activeTabKey;
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'claim-category-option';
        option.classList.toggle('active', selected);
        option.setAttribute('aria-pressed', String(selected));
        option.textContent = category.tabLabel || category.name;
        option.onclick = () => {
          switchClaimTab(category.id);
          closeMoreClaimCategories();
        };
        return option;
      }));
      claimHistoryMoreSheet.inert = false;
      claimHistoryMoreSheet.setAttribute('aria-hidden', 'false');
      claimHistoryMoreSheet.classList.add('active');
      claimHistoryMoreButton.setAttribute('aria-expanded', 'true');
      claimHistoryMoreClose.focus({ preventScroll: true });
    }

    function closeMoreClaimCategories() {
      claimHistoryMoreSheet.classList.remove('active');
      claimHistoryMoreButton.setAttribute('aria-expanded', 'false');
      claimHistoryMoreButton.focus({ preventScroll: true });
      claimHistoryMoreSheet.setAttribute('aria-hidden', 'true');
      claimHistoryMoreSheet.inert = true;
    }

    claimHistoryMoreSheet.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeMoreClaimCategories();
      } else if (event.key === 'Tab') {
        const last = claimHistoryMoreList.lastElementChild || claimHistoryMoreClose;
        if (event.target !== (event.shiftKey ? claimHistoryMoreClose : last)) return;
        event.preventDefault();
        (event.shiftKey ? last : claimHistoryMoreClose).focus();
      }
    });

    const historyFormTypes = {
      benefit: 'Benefit Claim',
      medical: 'Medical Claim',
      ot: 'OT Claim',
      travel: 'Travel Claim',
      travelRequest: 'Travel Request',
      entertainment: 'Entertainment Claim',
      advance: 'Advance Claim',
      expense: 'Expense Claim'
    };
    const historyFormAliases = { 'Travel Mileage': 'Travel Claim', Entertainment: 'Entertainment Claim' };

    function historyFormFiles(record) {
      const names = [record.attachments, record.uploadFiles, record.attachment].flat()
        .filter(name => typeof name === 'string')
        .map(name => name.trim())
        .filter(name => name && !/^(?:[-—]|no (?:data of )?(?:attachments?|upload files?))$/i.test(name));
      return [...new Set(names)];
    }

    function historyFormLine(item, record) {
      const line = item.claimDetails ?? item;
      const expense = line.expense ?? line.detailExpenses ?? item.category ?? item.title;
      return {
        ...line,
        expense, expenseType: line.expenseType ?? expense,
        date: line.transactionDate ?? line.date ?? record.claimDateFrom,
        txDate: line.txDate ?? line.transactionDate ?? record.claimDateFrom,
        receiptNo: line.receiptNo ?? record.receiptNo,
        amount: line.amount ?? line.detailAmount ?? line.claimAmount,
        localAmount: line.localAmount ?? line.claimAmount ?? line.detailLocalAmount,
        attachments: line === item ? [] : historyFormFiles(line)
      };
    }

    function historyFormJourney(leg) {
      return {
        ...leg,
        depDate: leg.depDate ?? leg.departDate,
        depTime: leg.depTime ?? leg.departTime,
        arrDate: leg.arrDate ?? leg.arrivalDate,
        arrTime: leg.arrTime ?? leg.arrivalTime,
        attachments: historyFormFiles(leg)
      };
    }

    function toHistoryFormRecord(item, kind) {
      const tab = item.historyTab || (item.savedBenefit ? 'benefit' : kind);
      const optionName = item.historyDetailType === 'travel-request' ? 'Travel Request' :
        historyFormTypes[tab] ?? historyFormAliases[item.optionName] ?? item.optionName;
      if (!Object.values(historyFormTypes).includes(optionName)) return null;

      const record = {
        ...item, optionName,
        period: item.period ?? item.claimPeriod,
        claimDateFrom: item.claimDateFrom ?? item.dateFrom,
        claimDateTo: item.claimDateTo ?? item.dateTo,
        receiptNo: item.receiptNo ?? item.receipt,
        remarks: item.remarks ?? item.remark,
        costCentre: item.costCentre ?? item.costCenter,
        attachments: historyFormFiles(item)
      };

      // Older history items use flat fields and single entries. Keep the form arrays on saved submissions.
      switch (optionName) {
        case 'Benefit Claim':
          return {
            ...record,
            benefitType: item.benefitType ?? item.subCatName ?? item.title,
            entitlementYear: item.entitlementYear ?? item.benefitYear,
            fromDate: item.fromDate ?? record.claimDateFrom,
            toDate: item.toDate ?? record.claimDateTo,
            claimQuantity: item.claimQuantity ?? item.quantity
          };
        case 'Medical Claim':
          return {
            ...record,
            benefitType: item.benefitType ?? item.medicalType,
            clinicName: item.clinicName ?? item.clinicHospital,
            sicknessType: item.sicknessType ?? item.sickness,
            detailItems: item.detailItems ?? [historyFormLine(item, record)]
          };
        case 'OT Claim': {
          const [start, end] = String(item.otTime ?? '').split(/\s+[-–]\s+/);
          return {
            ...record,
            otEntries: item.otEntries ?? [{
              ...record, date: item.otDate ?? record.claimDateFrom, otType: item.otType ?? item.title,
              otHours: item.otHours ?? item.quantity, startTime: item.startTime ?? start, endTime: item.endTime ?? end,
              reason: item.reason ?? item.purpose, attachments: []
            }]
          };
        }
        case 'Travel Claim': {
          const isParkingExpense = !item.mileageDetails && /\b(?:parking|toll)\b/i.test(item.title);
          const mileage = item.mileageDetails ? historyFormJourney(item.mileageDetails) : {
            depDate: record.claimDateFrom, arrDate: record.claimDateTo, amount: item.amount, description: item.purpose
          };
          return {
            ...record,
            mileageItems: item.mileageItems ?? (isParkingExpense ? [] : [mileage]),
            expenseItems: item.expenseItems ?? (isParkingExpense ? [{
              ...historyFormLine(item, record), dateFrom: record.claimDateFrom, dateTo: record.claimDateTo
            }] : [])
          };
        }
        case 'Travel Request': {
          const task = item.taskDetails;
          const leg = item.travelDetails;
          return {
            ...record,
            travelDateFrom: item.travelDateFrom ?? record.claimDateFrom,
            travelDateTo: item.travelDateTo ?? record.claimDateTo,
            taskItems: item.taskItems ?? (task ? [{ ...task, attachments: historyFormFiles(task) }] : []),
            requestTravelItems: item.requestTravelItems ?? (leg ? [{
              ...historyFormJourney(leg),
              noOfDays: leg.days, prefTransport: leg.preferredTransportType, hasAcc: leg.needAccommodation,
              hasAllow: leg.needAllowance, accDetails: leg.accommodationDetail, class: leg.travelClass,
              estDist: leg.distance, estCost: leg.amount
            }] : [])
          };
        }
        case 'Entertainment Claim':
          return {
            ...record,
            travellingMileageClaimNo: item.travellingMileageClaimNo ?? item.travelMileageClaimNo,
            entertainedPersonOrg: item.entertainedPersonOrg ?? item.entertainedPerson,
            internalAttendeeCount: item.internalAttendeeCount ?? item.internalAttendees,
            externalAttendeeCount: item.externalAttendeeCount ?? item.externalAttendees,
            avgPerPax: item.avgPerPax ?? item.averagePerPax,
            giftEnt: item.giftEnt ?? item.giftDeclaration,
            trvHosp: item.trvHosp ?? item.travelHospitalityDeclaration,
            entertainmentDetails: item.entertainmentDetails ?? [historyFormLine(item, record)]
          };
        case 'Advance Claim':
          return { ...record, advanceExpenseItems: item.advanceExpenseItems ?? [historyFormLine(item, record)] };
        case 'Expense Claim':
          return { ...record, itemizedDetails: item.itemizedDetails ?? [historyFormLine(item, record)] };
      }
    }

    function claimHistoryFormSummary(item) {
      const summary = document.createElement('section');
      summary.className = 'form-card claim-history-form-summary';
      summary.setAttribute('aria-label', 'Claim information');
      const employee = document.createElement('strong');
      employee.textContent = employeeCardHeading.text(item.empNo, item.empName);
      summary.append(employee, recordDetailStatus.create(getHistoryStatus(item).text));
      return summary;
    }

    function claimHistoryFormNotes(item) {
      const fields = [
        ['Payment Type', item.paymentType], ['Payment Period', item.paymentPeriod], ['Payment Date', item.paymentDate],
        ['Approved Amount', item.approvedAmount], ['Declaration', item.declaration], ['Agree', item.agree],
        ['Approver Action Comments', item.approverComment], ['Cancellation Remark', item.cancellationRemark]
      ].filter(([, value]) => value != null && value !== '');
      if (!fields.length) return null;
      const notes = document.createElement('dl');
      notes.className = 'form-card claim-history-form-notes';
      for (const [label, value] of fields) {
        const term = document.createElement('dt');
        term.className = 'field-label';
        term.textContent = label;
        const description = document.createElement('dd');
        description.textContent = ClaimApplicationFields.display(value);
        notes.append(term, description);
      }
      return notes;
    }

    function renderClaimDetail(kind, id) {
      const statusList = kind === 'status';
      if (!statusList && !Object.hasOwn(HISTORY_DATA, kind)) return;
      const items = [...savedClaimHistory(statusList ? null : kind), ...(statusList ? STATUS_HISTORY_RECORDS : HISTORY_DATA[kind])];
      const item = items.find(row => row.id === id);
      if (!item) return;
      const record = toHistoryFormRecord(item, kind);
      if (!record) return;
      if (!statusList && activeTabKey !== kind) switchClaimTab(kind);
      const formTitle = { 'Travel Claim': 'Travel Mileage', 'Advance Claim': 'Advance Request' }[record.optionName] || record.optionName;
      document.getElementById('claimHistoryDetailTitle').textContent = formTitle + ' Details';

      const options = { reference: item.id };
      const form = record.optionName === 'Benefit Claim' ? BenefitClaimForm.create(record, options) : ClaimReview.create(record, options);
      const container = document.getElementById('claimHistoryDetailBody');
      container.replaceChildren(claimHistoryFormSummary(item), form);
      const notes = claimHistoryFormNotes(item);
      if (notes) container.append(notes);
      return document.getElementById('detailsModalOverlay');
    }

    // Modal 3: Start Date, End Date & Benefit Type Filter Modal
    function openDateFilterModal() {
      updateFilterDropdownOptions();
      const modal = document.getElementById('filterModalOverlay');
      if (modal) modal.classList.add('active');
    }

    function closeDateFilterModal() {
      const modal = document.getElementById('filterModalOverlay');
      if (modal) modal.classList.remove('active');
    }

    function resetHistoryFilter() {
      activeStartPeriod = '202601';
      activeEndPeriod = '202612';
      activeBenefitType = 'all';
      updateFilterDropdownOptions();
    }

    function applyFilters() {
      const startYearEl = document.getElementById('filterStartYearInput');
      const startMonthEl = document.getElementById('filterStartMonthInput');
      const endYearEl = document.getElementById('filterEndYearInput');
      const endMonthEl = document.getElementById('filterEndMonthInput');
      const typeEl = document.getElementById('filterBenefitTypeSelect');

      if (startYearEl && startMonthEl) activeStartPeriod = `${startYearEl.value}${startMonthEl.value}`;
      if (endYearEl && endMonthEl) activeEndPeriod = `${endYearEl.value}${endMonthEl.value}`;
      if (typeEl && activeTabKey !== 'ot') activeBenefitType = typeEl.value;

      updateFilterBannerDisplay();
      renderClaimHistoryList();
      closeDateFilterModal();
    }

    function updateFilterBannerDisplay() {
      const display = document.getElementById('currentFilterTextDisplay');
      if (!display) return;

      const formatDisplayPeriod = (period) => {
        const year = period.slice(0, 4);
        const month = FILTER_MONTHS.find(item => item.value === period.slice(4, 6));
        return month ? `${month.text} ${year}` : period;
      };
      const filterTypes = BENEFIT_TYPES_MAP[activeTabKey] || [];
      const selectedFilterType = filterTypes.find(t => t.value === activeBenefitType);
      const summaryTypeStr = activeTabKey === 'ot' ? '' : (selectedFilterType ? selectedFilterType.text : 'All Types');
      display.textContent = [`${formatDisplayPeriod(activeStartPeriod)} - ${formatDisplayPeriod(activeEndPeriod)}`, summaryTypeStr]
        .filter(Boolean)
        .join(' | ');
      return;

      const formatDisplayDate = (iso) => {
        if (!iso) return '';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      };

      const startStr = formatDisplayDate(activeStartDate);
      const endStr = formatDisplayDate(activeEndDate);

      const types = BENEFIT_TYPES_MAP[activeTabKey] || [];
      const selectedObj = types.find(t => t.value === activeBenefitType);
      const typeStr = selectedObj ? selectedObj.text : 'All Benefit Types';

      display.textContent = `${startStr} – ${endStr} • ${typeStr}`;
    }

    window.addEventListener('storage', event => {
      if (event.key === ClaimRequestStore.key || event.key === null) {
        HistoryRecordPage.back();
        renderClaimHistoryList();
      }
    });

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      switchClaimTab('benefit', true);
      HistoryRecordPage.register(renderClaimDetail);
    });
  </script>
</body>
</html>
