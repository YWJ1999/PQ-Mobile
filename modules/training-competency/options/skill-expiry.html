<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Skill Expiry</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css"><link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/attendance-highlight-report.css"><link rel="stylesheet" href="../../../css/detail-popout.css">
  <link rel="stylesheet" href="../css/training-competency.css"><link rel="stylesheet" href="../../performance/css/performance-highlight.css">
  <link rel="stylesheet" href="../css/competency-summary.css">
  <script src="../../../js/components.js"></script><script src="../../../js/app.js" defer></script>
  <script src="../js/staff-competency-data.js" defer></script><script src="../js/competency-summary-data.js" defer></script><script src="../js/competency-summary.js" defer></script>
</head>
<body class="training-competency-page attendance-highlight-page performance-highlight-page cs-page skill-expiry-page" data-cs-page="summary" data-cs-report="skill-expiry">
  <preview-top-bar active-page="training-competency"></preview-top-bar>
  <div class="phone-container">
    <header class="training-competency-header performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="training-competency-header-row performance-header-row">
        <a id="csBack" class="training-competency-back performance-back" href="../index.html?scope=team" aria-label="Back"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1 id="csPageTitle">Skill Expiry</h1><span class="training-competency-header-spacer performance-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content cs-content">
      <div id="csUnavailable" class="cs-empty" hidden><i class="fa-solid fa-folder-open" aria-hidden="true"></i><h2>Employee unavailable</h2><p>The selected employee could not be found in this report.</p></div>
      <section id="csReportView" aria-label="Skill Expiry">
        <div class="filter-summary-bar performance-highlight-filter-summary"><div><small>Current Filter</small><strong id="csFilterSummary">All Skill Expiries</strong></div><button id="csFilterTrigger" type="button" aria-label="Open Skill Expiry filter" aria-haspopup="dialog" aria-controls="csFilterOverlay" aria-expanded="false"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button></div>
        <section class="attendance-report-summary record-summary-card" aria-label="Skill expiry totals"><div class="attendance-report-summary-row"><record-chart-count><strong id="csTotalRecords" class="record-summary-value" aria-live="polite">0</strong> <span class="record-summary-label">Records</span></record-chart-count><button id="csViewChart" class="view-chart-btn record-chart-button" type="button"><i class="fa-solid fa-chart-simple" aria-hidden="true"></i><span>Chart</span></button></div></section>
        <section class="attendance-report-table-card"><div class="attendance-report-table-scroll"><table id="csTable" class="attendance-report-table" data-kind="summary" aria-label="Competency counts"><thead><tr><th scope="col">Competency</th><th scope="col">Count</th></tr></thead><tbody></tbody></table></div></section>
      </section>
      <section id="csChartView" class="attendance-report-chart" aria-label="Skill expiry analysis" hidden>
        <section class="attendance-report-breakdown"><label for="csChartMetric">BREAKDOWN BY</label><select id="csChartMetric"></select></section>
        <section class="attendance-report-chart-card"><h2 id="csChartTitle"></h2><p id="csChartDescription"></p><div class="attendance-report-donut"><svg id="csChartDonut" viewBox="0 0 180 180" role="img"><circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle><g id="csChartSegments"></g></svg><div class="attendance-report-donut-center"><strong id="csChartTotal">0</strong><small>Total Records</small></div></div><p id="csChartNote" class="attendance-report-note"></p></section>
        <section class="attendance-report-legend"><div class="attendance-report-legend-head"><span id="csChartColumn">Competency</span><span>Count</span><span>Share</span></div><div id="csChartLegend"></div></section>
      </section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <div id="csFilterOverlay" class="performance-highlight-filter-overlay standard-filter-sheet" aria-hidden="true" hidden>
      <form id="csFilterForm" class="standard-filter-panel" data-standard-filter-ready="true" role="dialog" aria-modal="true" aria-labelledby="csFilterTitle">
        <div class="standard-filter-handle" aria-hidden="true"></div>
        <header class="standard-filter-header"><h2 id="csFilterTitle">Filter</h2><div class="standard-filter-header-actions"><button id="csResetFilter" class="standard-filter-reset" type="button"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button id="csCloseFilter" class="standard-filter-close" type="button" aria-label="Close filter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></header>
        <div class="performance-highlight-filter-fields">
          <div><label for="csKeyword">Search Keyword</label><input id="csKeyword" name="keyword" type="search" maxlength="200" placeholder="Search competency, employee or ID"></div>
          <div><label for="csCompany">Company</label><select id="csCompany" name="company"><option value="">All Companies</option></select></div>
          <div><label for="csBranch">Branch</label><select id="csBranch" name="branch"><option value="">All Branches</option></select></div>
          <div><label for="csDepartment">Department</label><select id="csDepartment" name="department"><option value="">All Departments</option></select></div>

          <div><label for="csLine">Line</label><select id="csLine" name="line"><option value="">All Lines</option></select></div>
          <div><label for="csCompetency">Competency</label><select id="csCompetency" name="competency"><option value="">All Competencies</option></select></div>
          <div><label id="csExpiryDateLabel">Expiry Date</label><div class="cs-expiry-date-range" role="group" aria-labelledby="csExpiryDateLabel">
            <div><input id="csExpiryFrom" name="expiryFrom" type="date" aria-label="Expiry date range start" aria-describedby="csFilterError"></div>
            <div><input id="csExpiryTo" name="expiryTo" type="date" aria-label="Expiry date range end" aria-describedby="csFilterError"></div>
          </div></div>
          <p id="csFilterError" class="performance-highlight-error" role="alert" hidden></p>
        </div>
        <footer class="standard-filter-footer"><button id="csApplyFilter" class="standard-filter-apply" type="submit">Apply Filter</button></footer>
      </form>
    </div>
    <div id="csModal" class="cs-modal detail-popout-overlay" aria-hidden="true" hidden>
      <section class="detail-popout-panel" role="dialog" aria-modal="true" aria-labelledby="csModalTitle">
        <header class="detail-popout-header"><h2 id="csModalTitle" class="detail-popout-title">Competency Details</h2><button id="csModalClose" class="detail-popout-close" type="button" aria-label="Close details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></header>
        <div id="csModalBody" class="detail-popout-body cs-modal-body" tabindex="0" role="region" aria-label="Competency detail content"></div>
      </section>
    </div>
  </div>
</body>
</html>
