<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/workplace-news.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/admin-app.js" defer></script>
  <script src="../../../js/company-news-data.js" defer></script>
  <script src="../js/workplace-news.js" defer></script>
</head>
<body class="admin-page news-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" data-admin-back href="../index.html" aria-label="Back to Workplace"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>News</h1></div>
        <button id="newsSearchToggle" type="button" class="news-header-search" aria-label="Search news" aria-controls="newsSearchPanel" aria-expanded="false"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
      </div>
    </header>
    <main class="main-content admin-content news-list-content">
      <div id="newsSearchPanel" role="search" hidden>
        <input id="newsSearch" type="search" placeholder="Search news" aria-label="Search announcements" autocomplete="off">
        <p id="newsResultCount" role="status"></p>
      </div>
      <section id="newsList" class="news-list" aria-label="News"></section>
      <section id="newsEmpty" class="news-empty" hidden>
        <span class="news-empty-icon"><i class="fa-regular fa-newspaper" aria-hidden="true"></i></span>
        <h2>No announcements found</h2>
        <p>There are no announcements to display.</p>
      </section>
      <noscript><p class="news-empty">Enable JavaScript to view company announcements.</p></noscript>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
