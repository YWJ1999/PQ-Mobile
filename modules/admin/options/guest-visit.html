<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Guest Visit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/vendor/fontawesome-6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/guest-visit.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/admin-app.js" defer></script>
  <script src="../js/workplace-history-store.js" defer></script>
  <script src="../js/workplace-pending-store.js" defer></script>
  <script src="../js/guest-visit-fields.js" defer></script>
  <script src="../js/guest-visit.js" defer></script>
</head>
<body class="admin-page guest-visit-page">
  <preview-top-bar active-page="workplace"></preview-top-bar>
  <div class="phone-container">
    <header class="admin-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="admin-header-row">
        <a class="admin-back" data-admin-back href="../index.html" aria-label="Back to Workplace"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="admin-heading"><h1>Guest Visit</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content admin-content">
      <form id="guestVisitForm" novalidate>
        <guest-visit-fields>
          <div id="visitGuestEditor" data-editor-for="guest" hidden>
          <div class="claim-form-card">
            <h2 class="form-section-heading">Guest Details</h2>
            <div class="claim-form-stack">
              <div class="claim-field"><label class="claim-field-label" for="visitGuestCompany">Company<span class="claim-required" aria-hidden="true">*</span></label><input id="visitGuestCompany" class="claim-control" type="text" maxlength="200" aria-required="true" placeholder="Enter company"></div>
              <div class="claim-field"><label class="claim-field-label" for="visitGuestRelation">Relation<span class="claim-required" aria-hidden="true">*</span></label><div class="visit-select"><select id="visitGuestRelation" class="claim-control" aria-required="true"><option value="">Select Relation</option><option value="customer">Customer</option><option value="supplier">Supplier</option><option value="partner">Partner</option><option value="other">Other</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>
              <div class="claim-field"><label class="claim-field-label" for="visitGuestName">Name<span class="claim-required" aria-hidden="true">*</span></label><input id="visitGuestName" class="claim-control" type="text" maxlength="200" aria-required="true" placeholder="Enter guest name"></div>
              <div class="claim-field"><label class="claim-field-label" for="visitGuestPosition">Position<span class="claim-required" aria-hidden="true">*</span></label><input id="visitGuestPosition" class="claim-control" type="text" maxlength="200" aria-required="true" placeholder="Enter position"></div>
            </div>
          </div>
          <div class="visit-entry-actions form-action-row"><button id="visitGuestCancelEdit" type="button" class="claim-button claim-button-primary"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button><button type="button" class="claim-button claim-button-primary" data-visit-save-draft><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Draft</span></button><button id="visitGuestAdd" type="button" class="claim-button claim-button-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Item</span></button></div>
          </div>
          <div id="visitAttendeeEditor" data-editor-for="attendee" hidden>
          <div class="claim-form-card">
            <h2 class="form-section-heading">Attendee Details</h2>
            <div class="claim-form-stack">
              <div class="claim-field"><label class="claim-field-label" for="visitStaff">Staff<span class="claim-required" aria-hidden="true">*</span></label><div class="visit-select"><select id="visitStaff" class="claim-control" aria-required="true"><option value="">Select Employee</option><option value="EBB01">Aina Rahman</option><option value="EBB02">Daniel Wong</option><option value="EBB03">Nur Izzati</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div><span id="visitSelectedStaffId" class="visit-employee-id" hidden></span></div>
              <div class="claim-field"><label class="claim-field-label" for="visitStaffDepartment">Department</label><input id="visitStaffDepartment" class="claim-control" type="text" readonly placeholder="Selected employee department"></div>
              <div class="claim-field"><label class="claim-field-label" for="visitStaffPosition">Position</label><input id="visitStaffPosition" class="claim-control" type="text" readonly placeholder="Selected employee position"></div>
            </div>
          </div>
          <div class="visit-entry-actions form-action-row"><button id="visitAttendeeCancelEdit" type="button" class="claim-button claim-button-primary"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button><button type="button" class="claim-button claim-button-primary" data-visit-save-draft><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Draft</span></button><button id="visitAttendeeAdd" type="button" class="claim-button claim-button-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Item</span></button></div>
          </div>
        </guest-visit-fields>
        <p id="visitFeedback" class="visit-feedback" role="status" aria-live="polite" hidden></p>
        <div id="visitPageActions" class="visit-page-actions form-action-row">
          <a id="visitCancel" class="claim-button claim-button-primary" data-admin-back href="../index.html"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a>
          <button id="visitPrevious" class="claim-button claim-button-primary" type="button" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></button>
          <button id="visitSaveDraft" class="claim-button claim-button-primary" type="button"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save Draft</span></button>
          <button id="visitNext" class="claim-button claim-button-primary" type="button"><span>Next</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
          <button id="visitSubmit" class="claim-button claim-button-primary" type="submit" hidden><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
