<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Deduction Request</title>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/payroll/payroll-config.js" defer></script>
  <script src="../../../js/payroll/payroll-request-store.js" defer></script>
  <script src="../../../js/payroll/payroll-request-fields.js" defer></script>
  <script src="../../../js/payroll/payroll-request-forms.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/vendor/fontawesome-6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/payroll-request-fields.css">
  <link rel="stylesheet" href="../../../css/payroll-request-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
</head>
<body>
  <preview-top-bar active-page="payroll"></preview-top-bar>
  <div class="phone-container payroll-form-phone">
    <header class="cal-top-header payroll-form-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>
      <div class="payroll-form-title-row">
        <button type="button" class="payroll-back" id="payrollBack" aria-label="Back to Payroll"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
        <h1>Deduction Request</h1>
      </div>
    </header>
    <main class="main-content">
      <form id="payrollForm" class="payroll-request-fields" data-request-kind="deduction">
        <template id="payrollRequestFields"></template>
        <div class="payroll-form-actions form-action-row">
          <button class="claim-button claim-button-primary" id="payrollCancel" data-page-form-cancel type="button"><i class="fa-solid fa-xmark" aria-hidden="true"></i>Cancel</button>
          <button class="claim-button claim-button-primary" id="payrollSubmit" type="submit" disabled><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
        <p class="payroll-form-status" id="payrollFormStatus" role="status" aria-live="polite">Loading saved form…</p>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <dialog class="payroll-exit-dialog" id="payrollExitDialog" aria-labelledby="exitTitle" aria-describedby="exitDescription">
      <h2 id="exitTitle">Discard unsaved changes?</h2><p id="exitDescription">Your latest edits and attachment changes have not been saved.</p>
      <div class="claim-action-bar"><button type="button" class="claim-button claim-button-secondary" id="payrollDiscard">Discard</button><button type="button" class="claim-button claim-button-primary" id="payrollKeepEditing" autofocus>Keep editing</button></div>
    </dialog>
  </div>
</body>
</html>
