<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Payroll Pending Approval</title>
  <link rel="stylesheet" href="../../../css/pending-approval-page.css">
  <script src="../../../js/pending-approval-page.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/vendor/fontawesome-6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/claim-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../../../css/payroll-request-fields.css">
  <link rel="stylesheet" href="../../../css/payroll-pending-approval.css">
  <link rel="stylesheet" href="../../../css/approval-actions.css">
  <link rel="stylesheet" href="../../../css/pending-approval-filter.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/pending-approval-filter.js" defer></script>
  <script src="../../../js/payroll/payroll-request-fields.js" defer></script>
  <script src="../../../js/payroll/payroll-request-store.js" defer></script>
  <script src="../../../js/payroll/payroll-history-data.js" defer></script>
  <script src="../../../js/payroll/payroll-pending-data.js" defer></script>
  <script src="../../../js/pending-approval-backup.js" defer></script>
  <script src="../../../js/payroll/payroll-pending-approval.js" defer></script>
</head>
<body class="payroll-pending-page unified-approval-actions">
  <preview-top-bar active-page="payroll"></preview-top-bar>
  <div class="phone-container">
    <header class="payroll-pending-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="payroll-pending-header-row">
        <a class="payroll-pending-back" id="payrollPendingBack" href="../index.html?scope=team" aria-label="Back to Payroll Team"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <h1>Pending Approval</h1>
      </div>
    </header>
    <main class="payroll-pending-content">
      <div class="payroll-pending-tabs" role="tablist" aria-label="Payroll request type">
        <button type="button" class="filter-pill active" id="payrollPendingTab-tax" data-payroll-tab="tax" role="tab" aria-selected="true" aria-controls="payrollPendingPanel">Tax Relief</button>
        <button type="button" class="filter-pill" id="payrollPendingTab-deduction" data-payroll-tab="deduction" role="tab" aria-selected="false" aria-controls="payrollPendingPanel" tabindex="-1">Deduction Request</button>
      </div>
      <div class="approval-filter-summary">
        <div class="payroll-pending-summary-copy"><small>Current Filter</small><div class="payroll-pending-summary-value"><span id="payrollPendingFilterSummary">All Requests &bull; All Dates</span></div></div>
        <button type="button" id="payrollPendingFilterTrigger" aria-label="Open pending approval filter" aria-haspopup="dialog" aria-controls="payrollPendingFilter"><i class="fa-solid fa-sliders" aria-hidden="true"></i></button>
      </div>
      <section id="payrollPendingPanel" data-record-colour-view="Approval status" data-record-legend='{"Pending":"submitted","Approved":"approved","Resubmit":"resubmit","Rejected":"rejected","Cancelled":"cancelled"}' role="tabpanel" aria-labelledby="payrollPendingTab-tax">
        <div class="payroll-pending-list-heading"><h2>Pending Approvals (<span id="payrollPendingCount">0</span>)</h2><label class="payroll-pending-select-all"><input type="checkbox" id="payrollPendingSelectAll">Select All</label></div>
        <div id="payrollPendingQueue"></div>
      </section>
    </main>
    <aside id="payrollPendingBulk" class="payroll-pending-bulk pending-selection-bar" aria-label="Selected requests" hidden>
      <strong aria-live="polite"><span id="payrollPendingSelectedCount">0</span> Selected</strong>
      <bulk-approval-actions action-key="payrollAction"></bulk-approval-actions>
    </aside>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>

    <div id="payrollPendingMenu" class="payroll-approval-overlay" hidden>
      <section class="payroll-approval-panel payroll-approval-menu" role="dialog" aria-modal="true" aria-labelledby="payrollPendingMenuTitle">
        <div class="payroll-approval-handle" aria-hidden="true"></div>
        <div class="payroll-approval-menu-heading"><h2 id="payrollPendingMenuTitle">Request Options</h2><button type="button" class="payroll-approval-close" data-close-payroll-sheet aria-label="Close request options"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
        <div class="payroll-approval-menu-options">
          <button type="button" class="payroll-approval-menu-option" id="payrollPendingViewDetails"><i class="fa-solid fa-eye" aria-hidden="true"></i><span>View Details</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
          <button type="button" class="payroll-approval-menu-option" id="payrollPendingViewWorkflow"><i class="fa-solid fa-diagram-project" aria-hidden="true"></i><span>View Workflow</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </div>
      </section>
    </div>
    <main id="payrollPendingDetails" class="approval-record-page" data-approval-view="details" aria-labelledby="payrollPendingDetailsTitle" hidden>
      <section class="approval-record-layout">
        <header class="approval-page-header">
          <phone-status-bar time="9:41"></phone-status-bar>
          <div class="approval-page-heading">
            <button type="button" data-approval-back aria-label="Back to pending approvals"></button>
            <h1 id="payrollPendingDetailsTitle" tabindex="-1">Tax Relief Approval</h1>
          </div>
        </header>
        <div class="payroll-approval-details-body">
          <div id="payrollPendingForm" class="payroll-request-fields"></div>
          <div class="claim-form-card payroll-review-comments">
            <label class="claim-field-label" for="payrollPendingApproverComments">Approver Action Comments</label>
            <textarea id="payrollPendingApproverComments" class="claim-control" rows="2" maxlength="2000" placeholder="Add comments (optional)"></textarea>
          </div>
        </div>
        <footer class="payroll-approval-details-footer pending-action-grid"></footer>
      </section>
    </main>
    <main id="payrollPendingWorkflow" class="approval-record-page" data-approval-view="workflow" aria-labelledby="payrollPendingWorkflowTitle" hidden>
      <section class="approval-record-layout">
        <header class="approval-page-header">
          <phone-status-bar time="9:41"></phone-status-bar>
          <div class="approval-page-heading">
            <button type="button" data-approval-back aria-label="Back to pending approvals"></button>
            <h1 id="payrollPendingWorkflowTitle" tabindex="-1">Approval Workflow</h1>
          </div>
        </header>
        <div class="payroll-approval-workflow-body">
          <section id="payrollPendingWorkflowRequest" class="payroll-approval-workflow-request" aria-label="Workflow request"></section>
          <section aria-labelledby="payrollPendingWorkflowStepsTitle">
            <h3 id="payrollPendingWorkflowStepsTitle">Approval Steps</h3>
            <ol id="payrollPendingWorkflowSteps" class="payroll-approval-workflow-steps"></ol>
          </section>
          <section class="payroll-approval-workflow-audit" aria-labelledby="payrollPendingWorkflowAuditTitle">
            <h3 id="payrollPendingWorkflowAuditTitle">Audit History</h3>
            <ul id="payrollPendingWorkflowAudit"></ul>
          </section>
        </div>
        <footer class="payroll-approval-workflow-footer"><button type="button" class="action-btn-cancel" data-approval-back><i class="fa-solid fa-xmark" aria-hidden="true"></i>Close Workflow</button></footer>
      </section>
    </main>
  </div>
</body>
</html>
