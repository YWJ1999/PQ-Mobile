<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Self Review</title>
  <script>(() => { document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/vendor/fontawesome-6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../employee-career/css/employee-career.css">
  <link rel="stylesheet" href="../../employee-career/css/employee-career-forms.css">
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
  <link rel="stylesheet" href="../css/performance.css">
  <link rel="stylesheet" href="../css/self-review.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../js/performance-request-form.js" defer></script>
  <script src="../js/performance-submissions.js" defer></script>
  <script src="../js/self-review.js" defer></script>
</head>
<body class="performance-page employee-career-form-page employee-career-team-form-page self-review-page">
  <preview-top-bar active-page="performance"></preview-top-bar>
  <div class="phone-container">
    <header class="performance-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="performance-header-row"><a id="selfReviewBack" class="performance-back" href="../index.html?scope=individual" aria-label="Back to Performance"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a><h1>Self Review</h1><span class="performance-header-spacer" aria-hidden="true"></span></div>
    </header>
    <main class="main-content employee-career-content">
      <form id="selfReviewForm" aria-label="Self Review">
        <div id="selfReviewFields"></div>
        <div class="employee-career-form-actions form-action-row"><a id="selfReviewCancel" class="form-cancel-btn" href="../index.html?scope=individual"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Cancel</span></a><button id="selfReviewSubmit" type="submit" class="employee-career-button primary"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></div>
        <p id="selfReviewStatus" class="self-review-status" role="status" aria-live="polite" hidden></p>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
  </div>
</body>
</html>
