<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeopleHCM - Daily OT Approval</title>
  <script>
    (() => {
      const theme = new URLSearchParams(window.location.search).get('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/vendor/fontawesome-6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="daily-ot-details.css">
</head>
<body>
  <preview-top-bar active-page="attendance"></preview-top-bar>

  <div class="phone-container">
    <header class="daily-ot-header">
      <phone-status-bar time="9:41" style="color: #ffffff;"></phone-status-bar>
      <div class="daily-ot-header-row">
        <a id="dailyOtBack" class="header-back-button" href="daily-ot.html" aria-label="Back to Daily OT">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h1 id="dailyOtDetailTitle">Daily OT Approval</h1>
      </div>
    </header>

    <main class="daily-ot-detail-content">
      <form id="dailyOtForm">
        <div class="entries-heading">
          <h2 id="dailyOtEntriesTitle">OT entries</h2>
          <span id="dailyOtDuration">Duration (HHMM)</span>
        </div>
        <div class="history-card-item daily-ot-table-wrap">
          <table class="daily-ot-entries-table" aria-labelledby="dailyOtEntriesTitle" aria-describedby="dailyOtDuration">
            <thead>
              <tr>
                <th scope="col">OT type</th>
                <th scope="col">Actual</th>
                <th scope="col">Approved</th>
              </tr>
            </thead>
            <tbody id="dailyOtRecords"></tbody>
          </table>
        </div>
      </form>
    </main>

    <footer id="dailyOtActions" class="detail-actions">
      <div class="approved-total">
        <label for="dailyOtTotal">Total approved OT (hours)</label>
        <output id="dailyOtTotal" aria-live="polite">0.00</output>
      </div>
      <button id="dailyOtUpdate" class="primary-action" type="submit" form="dailyOtForm">Update</button>
      <div id="dailyOtToast" class="detail-toast" role="status"></div>
    </footer>
    <phone-bottom-nav in-flow active="apps"></phone-bottom-nav>
  </div>

  <template id="dailyOtEntry">
    <tr class="daily-ot-record">
      <td>
        <span class="ot-type-name"></span>
        <label class="daily-ot-void-control">
          <input class="daily-ot-void-checkbox" type="checkbox">
          <span>Void entry</span>
        </label>
      </td>
      <td class="record-readonly"></td>
      <td>
        <label class="approved-field">
          <input class="daily-ot-approval-input" type="text" inputmode="numeric" maxlength="4"
                 required pattern="[0-9]{2}[0-5][0-9]" autocomplete="off" placeholder="HHMM"
                 title="Enter four digits in HHMM format, with minutes from 00 to 59.">
          <i class="fa-solid fa-pen" aria-hidden="true"></i>
        </label>
      </td>
    </tr>
  </template>
  <script src="daily-ot-data.js"></script>
  <script src="daily-ot-details.js"></script>
</body>
</html>
