<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Work Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/vendor/fontawesome-6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="../../../css/project-task.css">
  <link rel="stylesheet" href="../../../css/project-task-forms.css">
  <link rel="stylesheet" href="../../../css/work-plan-form.css">
  <script src="../../../js/components.js"></script>
  <script src="../../../js/app.js" defer></script>
  <script src="../../../js/project-task/project-task-app.js" defer></script>
  <script src="../../../js/project-task/work-plan-form.js" defer></script>
  <script src="../../../js/project-task/project-task-forms.js" defer></script>
  <link rel="stylesheet" href="../../../css/form-section-headings.css">
</head>
<body class="project-task-page project-form-page work-plan-page">
  <preview-top-bar active-page="project-task"></preview-top-bar>
  <div class="phone-container">
    <header class="project-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="project-header-row">
        <a class="project-back" data-work-plan-back href="../index.html?scope=individual" aria-label="Back to Project and Task"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="project-header-title"><h1>Work Plan</h1></div>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content project-task-content">
      <form id="workPlanForm" novalidate>
        <template id="workPlanFields"></template>
        <div class="project-form-actions form-action-row">
          <a class="form-cancel-btn" data-page-form-cancel data-work-plan-back href="../index.html?scope=individual"><span>Cancel</span></a>
          <button type="submit" class="btn-submit-primary" id="submitWorkPlan"><span>Submit</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
        </div>
        <p class="project-form-feedback" id="workPlanFeedback" role="status" hidden></p>
      </form>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>
  </div>
</body>
</html>
