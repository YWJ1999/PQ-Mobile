<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Vacant Position</title>
  <script>(()=>{const q=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=q==='light'?'light':'dark';})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../../../css/theme.css">
  <link rel="stylesheet" href="../../../../css/app.css">
  <link rel="stylesheet" href="../../../../css/history-cards.css">
  <link rel="stylesheet" href="../../css/employee-career.css">
  <link rel="stylesheet" href="../../css/staff-list.css">
  <link rel="stylesheet" href="../../css/manpower-statistics.css">
  <link rel="stylesheet" href="../../css/active-headcount.css">
  <link rel="stylesheet" href="../../css/vacant-position.css">
  <script src="../../../../js/components.js"></script>
  <script src="../../../../js/app.js" defer></script>
  <script src="../../js/employee-career-option.js" defer></script>
  <script src="../../js/vacancy-data.js"></script>
  <script src="../../js/vacant-position-data.js"></script>
  <script src="../../js/vacant-position.js" defer></script>
</head>
<body class="employee-career-option-page staff-list-page active-headcount-page vacant-position-page">
  <preview-top-bar active-page="v2"></preview-top-bar>
  <div class="phone-container">
    <header class="employee-career-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="employee-career-header-row">
        <a id="vacantPositionBack" class="employee-career-back" data-option-back href="../../index.html?scope=team" aria-label="Back to Employee and Career"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
        <div class="employee-career-heading"><h1 id="vacantPositionTitle">Vacant Position</h1></div>
        <span class="employee-career-header-spacer" aria-hidden="true"></span>
      </div>
    </header>
    <main class="main-content employee-career-content">
      <section id="vacantPositionChartView" aria-label="Vacant position chart">
        <article class="staff-list-donut-card active-headcount-chart-card">
          <div class="staff-list-chart-heading active-headcount-chart-heading">
            <div><h2>Vacant Position by Job</h2><p>Open vacancies</p></div>
            <button type="button" id="vacantPositionDetails" class="active-headcount-details-button"><i class="fa-solid fa-list-ul" aria-hidden="true"></i><span>View Details</span></button>
          </div>
          <div class="staff-list-donut">
            <svg viewBox="0 0 180 180" role="img" aria-label="Open vacant positions by job">
              <circle cx="90" cy="90" r="70" fill="none" stroke="var(--border-subtle)" stroke-width="22"></circle>
              <g id="vacantPositionChartSegments"></g>
            </svg>
            <div class="staff-list-donut-center"><strong id="vacantPositionChartTotal">0</strong><span>Positions</span></div>
          </div>
          <p class="staff-list-chart-note">Share of open vacant positions</p>
        </article>
        <section id="vacantPositionLegend" class="staff-list-legend-card" aria-label="Vacant position chart legend">
          <div class="staff-list-legend-head active-headcount-legend-grid"><span>Job</span><span>Count</span><span>% of Total</span></div>
          <div id="vacantPositionChartLegend" class="staff-list-legend"></div>
        </section>
      </section>
      <section id="vacantPositionSummaryView" aria-label="Vacancy summary by job" hidden>
        <div class="history-total-records-card record-summary-metric record-summary-card"><strong id="vacantPositionSummaryTotalRecords" class="history-total-records-value record-summary-value" data-record-count>0</strong> <span class="history-total-records-label record-summary-label">Records</span></div>
        <div class="active-headcount-summary-table-wrap">
          <table class="active-headcount-summary-table" aria-label="Vacant position counts by job"><thead><tr><th scope="col">Job</th><th scope="col">Count</th></tr></thead><tbody id="vacantPositionSummaryRows"></tbody></table>
        </div>
      </section>
      <section id="vacantPositionRecordsView" aria-label="Open vacancy records" hidden>
        <div class="history-total-records-card record-summary-metric record-summary-card"><strong id="vacantPositionRecordsTotal" class="history-total-records-value record-summary-value" data-record-count>0</strong> <span class="history-total-records-label record-summary-label">Records</span></div>
        <div id="vacantPositionRecords" class="active-headcount-staff-list"></div>
      </section>
      <section id="vacantPositionEmpty" class="vacant-position-empty" hidden><i class="fa-solid fa-briefcase" aria-hidden="true"></i><h2>No Open Positions</h2><p>There are currently no open vacancy records.</p></section>
    </main>
    <phone-bottom-nav active="apps"></phone-bottom-nav>
    <left-profile-drawer></left-profile-drawer>
    <notification-sheet></notification-sheet>
    <favourite-sheet></favourite-sheet>
    <p id="vacantPositionStatus" class="manpower-drilldown-status" aria-live="polite"></p>
    <div id="vacantPositionDetailOverlay" class="manpower-detail-overlay active-headcount-detail-overlay" role="dialog" aria-modal="true" aria-labelledby="vacantPositionDetailTitle" aria-hidden="true" hidden>
      <section class="manpower-detail-panel active-headcount-detail-panel">
        <header class="manpower-detail-header active-headcount-detail-header"><h2 id="vacantPositionDetailTitle">Vacancy Details</h2><button type="button" id="vacantPositionDetailClose" class="manpower-detail-close active-headcount-detail-close" aria-label="Close vacancy details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></header>
        <div class="manpower-detail-body active-headcount-detail-body"><table id="vacantPositionDetailTable" class="manpower-detail-table active-headcount-detail-table"><tbody></tbody></table></div>
      </section>
    </div>
  </div>
</body>
</html>
