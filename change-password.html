<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleHCM - Change Password</title>
  <script>
    (() => {
      let theme = new URLSearchParams(location.search).get('theme');
      if (!theme) {
        try { theme = localStorage.getItem('peoplehcm_theme'); } catch {}
      }
      document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/change-password.css">
  <script src="js/components.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/change-password.js" defer></script>
</head>
<body>
  <preview-top-bar></preview-top-bar>

  <div class="phone-container settings-page password-page">
    <header class="settings-header">
      <phone-status-bar time="9:41"></phone-status-bar>
      <div class="settings-toolbar">
        <button type="button" class="settings-header-button" onclick="navTo('home')" aria-label="Back">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <h1>Change Password</h1>
        <button type="button" class="settings-header-button" onclick="openProfileDrawer()" aria-label="Open navigation menu">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="main-content password-content">
      <p class="password-intro" id="passwordIntro">Enter your current password, then choose and confirm your new password.</p>
      <form id="changePasswordForm" aria-describedby="passwordIntro passwordPreviewNote" novalidate>
        <div class="password-card">
          <div class="password-field">
            <label for="currentPassword">Current password</label>
            <div class="password-input-wrap">
              <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="none" required placeholder="Enter current password" aria-describedby="currentPasswordError">
              <button type="button" class="password-visibility" aria-label="Show current password" aria-controls="currentPassword" aria-pressed="false" data-label="current password">
                <i class="fa-regular fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="password-field-error" id="currentPasswordError" hidden></p>
          </div>

          <div class="password-field">
            <label for="newPassword">New password</label>
            <div class="password-input-wrap">
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" required placeholder="Enter new password" aria-describedby="newPasswordError">
              <button type="button" class="password-visibility" aria-label="Show new password" aria-controls="newPassword" aria-pressed="false" data-label="new password">
                <i class="fa-regular fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="password-field-error" id="newPasswordError" hidden></p>
          </div>

          <div class="password-field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="password-input-wrap">
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" required placeholder="Re-enter new password" aria-describedby="confirmPasswordError">
              <button type="button" class="password-visibility" aria-label="Show confirmed password" aria-controls="confirmPassword" aria-pressed="false" data-label="confirmed password">
                <i class="fa-regular fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="password-field-error" id="confirmPasswordError" hidden></p>
          </div>
        </div>

        <button type="submit" class="password-submit">
          <i class="fa-solid fa-key" aria-hidden="true"></i>
          <span>Update Password</span>
        </button>
        <p class="password-preview-note" id="passwordPreviewNote">Password updates are not available in this preview.</p>
        <p class="password-feedback" id="passwordFeedback" role="status" aria-live="polite"></p>
      </form>
    </main>
    <div class="password-home-indicator" aria-hidden="true"><span></span></div>
    <left-profile-drawer></left-profile-drawer>
  </div>
</body>
</html>
